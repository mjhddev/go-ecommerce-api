name: go-ecommerce-api

services:
  postgres:
    image: postgres:17-alpine
    container_name: go-ecommerce-db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    image: go-ecommerce-api:latest
    build:
      context: .
      dockerfile: Dockerfile

    container_name: go-ecommerce-api
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
  
    ports:
      - "${APP_PORT}:8080"

    volumes:
      - ./uploads:/app/uploads

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  seed:
    image: go-ecommerce-api:latest
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    working_dir: /app

    entrypoint: ["/app/ecommerce-seed"]

    restart: "no"

    profiles:
      - tools

volumes:
  postgres_data: